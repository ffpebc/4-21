<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="40%" stop-color="#4F46E5" />
      <stop offset="76%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>

    <linearGradient id="glassTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.14" />
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.40" />
    </linearGradient>

    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="url(#rimGrad)" stroke-width="2.5" />
  <path d="M 28 130 C 28 64 68 28 136 28 L 376 28 C 444 28 484 64 484 130 L 484 195 C 360 240 152 240 28 195 Z" fill="url(#glassTop)" />

  <text x="256" y="218" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-weight="900" font-size="126" letter-spacing="-3" filter="url(#glowShadow)">ЕГЭ</text>

  <g filter="url(#glowShadow)">
    <rect x="86" y="272" width="340" height="120" rx="60" fill="url(#pillGrad)" stroke="url(#rimGrad)" stroke-width="2" />
    <text x="256" y="358" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif" font-weight="800" font-size="76" letter-spacing="-1">4–22</text>
  </g>

  <text x="256" y="438" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.82" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-weight="700" font-size="20" letter-spacing="4">РУССКИЙ ЯЗЫК</text>
</svg>
