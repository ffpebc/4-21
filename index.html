<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" id="app-theme-color" content="#E6ECF8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ЕГЭ 4–22" />
    <meta name="application-name" content="ЕГЭ 4–22" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="./apple-touch-icon.png" />
    <title>ЕГЭ Русский 4–22 — iOS 27 Тренажёр</title>
    <meta name="description" content="Интерактивный тренажёр ЕГЭ по русскому языку (задания 4–22, база заданий ФИПИ) с конспектом, банком ошибок и мультиуровневым сохранением прогресса для Google Sites и iOS." />
    <meta property="og:title" content="ЕГЭ Русский 4–22 — iOS 27 Тренажёр" />
    <meta property="og:description" content="Интерактивный тренажёр ЕГЭ по русскому языку (задания 4–22, база заданий ФИПИ) с конспектом, банком ошибок и мультиуровневым сохранением прогресса для Google Sites и iOS." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-height: 100%;
        min-height: 100dvh;
        background-color: #E6ECF8;
        color: #0B0F19;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      #root {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-height: 100%;
        min-height: 100dvh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        background: transparent;
      }
      body.keyboard-open #root {
        height: var(--app-height, 100%) !important;
      }
      body.keyboard-open .ios-tabbar {
        display: none !important;
      }
      html.dark, html.dark body {
        background-color: #000000;
        color: #FFFFFF;
      }
    </style>
    <script>
      (function () {
        if (typeof history !== 'undefined' && 'scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }

        function isInputActive() {
          var el = document.activeElement;
          return !!(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA'));
        }

        function forceViewportReflow() {
          if (isInputActive()) return;
          var root = document.getElementById('root');
          if (root) {
            var prev = root.style.display;
            root.style.display = 'none';
            void root.offsetHeight;
            root.style.display = prev;
          }
          restoreScrollPosition();
        }

        function restoreScrollPosition() {
          if (window.scrollY !== 0 || window.scrollX !== 0) {
            window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
          }
          if (document.body && document.body.scrollTop !== 0) document.body.scrollTop = 0;
          if (document.documentElement && document.documentElement.scrollTop !== 0) document.documentElement.scrollTop = 0;
          if (document.scrollingElement && document.scrollingElement.scrollTop !== 0) document.scrollingElement.scrollTop = 0;
        }

        function syncAppViewport() {
          var isInput = isInputActive();
          var vv = window.visualViewport;
          var winH = window.innerHeight || (document.documentElement ? document.documentElement.clientHeight : 0) || 0;
          var isKeyboard = isInput && vv && vv.height < winH * 0.88;

          if (isKeyboard && vv && vv.height > 0) {
            document.documentElement.style.setProperty('--app-height', Math.round(vv.height) + 'px');
            document.body.classList.add('keyboard-open');
          } else {
            document.documentElement.style.removeProperty('--app-height');
            if (document.body) document.body.classList.remove('keyboard-open');
            if (!isInput) {
              restoreScrollPosition();
            }
          }
        }
        syncAppViewport();

        window.addEventListener('DOMContentLoaded', function () {
          syncAppViewport();
          restoreScrollPosition();
          forceViewportReflow();
        }, { passive: true });

        window.addEventListener('load', function () {
          syncAppViewport();
          restoreScrollPosition();
          forceViewportReflow();
        }, { passive: true });

        window.addEventListener('resize', syncAppViewport, { passive: true });
        window.addEventListener('orientationchange', function () {
          syncAppViewport();
          setTimeout(restoreScrollPosition, 100);
          setTimeout(forceViewportReflow, 120);
        }, { passive: true });
        window.addEventListener('pageshow', function () {
          syncAppViewport();
          restoreScrollPosition();
          forceViewportReflow();
          setTimeout(restoreScrollPosition, 50);
          setTimeout(restoreScrollPosition, 150);
          setTimeout(forceViewportReflow, 180);
        }, { passive: true });
        window.addEventListener('scroll', function () {
          if (!isInputActive() && (window.scrollY !== 0 || window.scrollX !== 0)) {
            restoreScrollPosition();
          }
        }, { passive: true });
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') {
            syncAppViewport();
            restoreScrollPosition();
            forceViewportReflow();
            setTimeout(restoreScrollPosition, 50);
            setTimeout(restoreScrollPosition, 150);
            setTimeout(forceViewportReflow, 180);
          }
        }, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', function () {
            syncAppViewport();
            if (!isInputActive()) {
              restoreScrollPosition();
              setTimeout(restoreScrollPosition, 50);
              setTimeout(restoreScrollPosition, 180);
              setTimeout(restoreScrollPosition, 350);
              setTimeout(restoreScrollPosition, 500);
            }
          }, { passive: true });
          window.visualViewport.addEventListener('scroll', function () {
            if (!isInputActive()) {
              restoreScrollPosition();
            }
          }, { passive: true });
        }
        window.addEventListener('focusout', function () {
          document.documentElement.style.removeProperty('--app-height');
          if (document.body) document.body.classList.remove('keyboard-open');
          restoreScrollPosition();
          setTimeout(restoreScrollPosition, 50);
          setTimeout(restoreScrollPosition, 150);
          setTimeout(restoreScrollPosition, 300);
          setTimeout(restoreScrollPosition, 500);
          setTimeout(syncAppViewport, 520);
          setTimeout(forceViewportReflow, 530);
        }, { passive: true });
        setTimeout(syncAppViewport, 60);
        setTimeout(forceViewportReflow, 65);
        setTimeout(syncAppViewport, 250);
        setTimeout(forceViewportReflow, 260);
        setTimeout(syncAppViewport, 600);
        setTimeout(forceViewportReflow, 620);

        try {
          var raw = localStorage.getItem('ege_trainer_ios27_v3') || localStorage.getItem('ege_ortho_ios27_v6');
          if (raw) {
            var isDark = false;
            if (raw.indexOf('"darkMode":true') !== -1 || raw.indexOf('"d":1') !== -1) {
              isDark = true;
            } else if (raw.indexOf('EGE27-') === 0) {
              try {
                var b64 = raw.slice(6).replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4) b64 += '=';
                var decoded = decodeURIComponent(escape(atob(b64)));
                if (decoded.indexOf('"d":1') !== -1) isDark = true;
              } catch (_) {}
            }
            if (isDark) {
              document.documentElement.classList.add('dark');
              var meta = document.getElementById('app-theme-color');
              if (meta) meta.setAttribute('content', '#000000');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
