    <meta property="og:description" content="Интерактивный тренажёр ЕГЭ по русскому языку (задания 4–22, база заданий ФИПИ) с конспектом, банком ошибок и мультиуровневым сохранением прогресса для Google Sites и iOS." />

    <style>
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-height: 100%;
        min-height: -webkit-fill-available;
        min-height: 100dvh;
        background-color: #E6ECF8;
        color: #0B0F19;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-height: 100%;
        min-height: -webkit-fill-available;
        min-height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        background-color: #E6ECF8;
        color: #0B0F19;
      }
      #root {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        height: 100dvh;
        min-height: 100%;
        min-height: -webkit-fill-available;
        min-height: 100dvh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        background: transparent;
      }
      html.dark, html.dark body {
        background-color: #000000;
        color: #FFFFFF;
      }
    </style>
    <script>
      (function () {
        function syncAppViewport() {
          var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
          var h = Math.max(vh || 0, window.innerHeight || 0);
          if (h && h > 0) {
            document.documentElement.style.setProperty('--app-height', Math.round(h) + 'px');
          }
        }
        syncAppViewport();
        window.addEventListener('resize', syncAppViewport, { passive: true });
        window.addEventListener('orientationchange', syncAppViewport, { passive: true });
        window.addEventListener('pageshow', syncAppViewport, { passive: true });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', syncAppViewport, { passive: true });
        }
        setTimeout(syncAppViewport, 60);
        setTimeout(syncAppViewport, 250);
        setTimeout(syncAppViewport, 600);

        try {
          var raw = localStorage.getItem('ege_trainer_ios27_v3') || localStorage.getItem('ege_ortho_ios27_v6');
          if (raw) {
            var isDark = false;
            if (raw.indexOf('"darkMode":true') !== -1 || raw.indexOf('"d":1') !== -1) {
              isDark = true;
            } else if (raw.indexOf('EGE27-') === 0) {
              try {
                var b64 = raw.slice(6).replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4) b64 += '=';
                var decoded = decodeURIComponent(escape(atob(b64)));
                if (decoded.indexOf('"d":1') !== -1) isDark = true;
              } catch (_) {}
            }
            if (isDark) {
              document.documentElement.classList.add('dark');
              var meta = document.getElementById('app-theme-color');
              if (meta) meta.setAttribute('content', '#000000');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
